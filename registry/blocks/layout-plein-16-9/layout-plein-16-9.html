<!DOCTYPE html>
<html lang="fr" data-composition-variables="[
  {&quot;id&quot;:&quot;video&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Video (segment pre-cadre, 1080x1920)&quot;,&quot;default&quot;:&quot;assets/frame-plein.mp4&quot;},
  {&quot;id&quot;:&quot;debut&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Debut dans la source (s)&quot;,&quot;default&quot;:0},
  {&quot;id&quot;:&quot;duree&quot;,&quot;type&quot;:&quot;number&quot;,&quot;label&quot;:&quot;Duree (s)&quot;,&quot;default&quot;:5}
]">
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
<!--
  LAYOUT « PLEIN » 16:9 + FLou (DSS) — composition reutilisable.
  On POSE LA VIDEO dans le placeholder : le lecteur monte cette composition avec
    data-composition-src="compositions/DSS/layout-plein-16-9.html"
    data-variable-values='{"video":"assets/frame-plein.mp4","debut":61.5,"duree":77}'
  Le segment doit etre DEJA pre-cadre par ffmpeg (recette : templates-dss/layout-plein-16-9-flou.md),
  c'est-a-dire un 1080x1920 contenant deja la bande nette au centre (y 656..1264) et le flou haut/bas.
-->
<template>
  <div data-hf-id="hf-sooz" data-composition-id="layout-plein-16-9" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <video data-hf-id="hf-vz6u" id="layout-plein-16-9-video" class="clip" data-start="0" data-duration="5" data-var-src="video" src="assets/frame-plein.mp4" data-track-index="0" muted playsinline></video>
    <style>
      #layout-plein-16-9-video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["layout-plein-16-9"] = gsap.timeline({paused: true});
      (() => {
        const v = window.__hyperframes?.getVariables?.() || {};
        const host = document.querySelector('[data-composition-id="layout-plein-16-9"]');
        if (host && v.duree) host.setAttribute('data-duration', String(v.duree));
        const vid = document.getElementById('layout-plein-16-9-video');
        if (vid && v.debut) vid.setAttribute('data-media-start', String(v.debut));
      })();
    </script>
  </div>
</template>
</body>
</html>

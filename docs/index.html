<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banque HyperFrames MEG</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--line:#252b38;--txt:#eef1f7;--dim:#98a2b3;--meg:#3ddc97;--dss:#5aa9ff;--commun:#f0c860}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:rgba(11,13,18,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px;z-index:5}
h1{margin:0 0 10px;font-size:18px;font-weight:650}
.sub{color:var(--dim);font-size:12px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:#101420;color:var(--dim);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.tab.on{color:#0b0d12;background:var(--txt);border-color:var(--txt);font-weight:600}
input[type=search]{flex:1;min-width:200px;background:#101420;border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:10px;font-size:14px}
main{padding:18px 20px 60px}
section{margin-bottom:38px}
h2{display:flex;align-items:center;gap:10px;font-size:15px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 14px}
h2 .dot{width:10px;height:10px;border-radius:50%}
h2 .n{color:var(--dim);font-size:12px;letter-spacing:0;text-transform:none}
h3{display:flex;align-items:baseline;gap:8px;font-size:13px;margin:0 0 10px;color:#cdd5e2;border-top:1px solid var(--line);padding-top:12px}
h3 .n{color:var(--dim);font-size:11.5px}
.groupe{margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:9/16;max-height:260px;background:#0d1017 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#3a4354;font-size:12px}
.thumb.land{aspect-ratio:16/9}
.body{padding:10px 12px 12px}
.name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--dim);word-break:break-all}
.title{font-weight:600;margin:4px 0 6px;font-size:14px}
.desc{color:var(--dim);font-size:12.5px;min-height:34px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.tag.commun{color:#0b0d12;background:var(--commun);border-color:var(--commun);font-weight:600}
.cmd{display:flex;gap:6px;align-items:flex-start;margin-top:auto}
code{flex:1;font-size:11.5px;background:#0d1017;border:1px solid var(--line);border-radius:8px;padding:6px 8px;white-space:pre-wrap;word-break:break-all;line-height:1.35}
button.copy{flex:0 0 auto;border:1px solid var(--line);background:#101420;color:var(--txt);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px}
.empty{color:var(--dim);font-size:13px}
.note{color:var(--dim);font-size:12.5px;margin:-8px 0 16px}
</style>
</head>
<body>
<header>
  <h1>Banque HyperFrames MEG</h1>
  <div class=bar>
    <div class=tabs>
      <button class="tab on" data-f="ALL">Tout</button>
      <button class=tab data-f="COMMUN">Commun</button>
      <button class=tab data-f="MEG">MEG</button>
      <button class=tab data-f="DSS">DSS</button>
    </div>
    <input type=search id=q placeholder="Rechercher un layout, un tag...">
    <span class=sub id=st>lecture...</span>
  </div>
</header>
<main id=out></main>
<script>
// Base de donnees : marche en direct (githack / Pages / serveur local) et via htmlpreview.github.io
function dataBase() {
  const q = location.search.replace(/^\?/, "");
  if (location.hostname === "htmlpreview.github.io" && q.startsWith("http")) {
    // via htmlpreview : les donnees passent par jsDelivr (CORS + cache CDN)
    const m = q.match(/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\//);
    if (m) return new URL("https://cdn.jsdelivr.net/gh/" + m[1] + "/" + m[2] + "@" + m[3] + "/");
    return new URL("./", location.href);
  }
  return new URL("./", location.href);
}
const BASE = dataBase();
let items = [], filter = "ALL", q = "";
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const FORMATS_CONNUS = ["mobile", "youtube"];
const FORMAT_LABELS = { mobile: "Mobile (9:16 · 1080×1920)", youtube: "YouTube (16:9 · 1920×1080)" };

// Regroupement par FORMAT. Un bloc hors 1080x1920 / 1920x1080 garde le groupe
// de sa dimension reelle (jamais un groupe invente).
function groupesDe(list) {
  const groupes = FORMATS_CONNUS.map((key) => ({
    key,
    label: FORMAT_LABELS[key],
    items: list.filter((i) => i.format === key),
  }));
  const autres = new Map();
  list.filter((i) => !FORMATS_CONNUS.includes(i.format)).forEach((i) => {
    if (!autres.has(i.format)) autres.set(i.format, { key: i.format, label: i.formatLabel, items: [] });
    autres.get(i.format).items.push(i);
  });
  return groupes.concat([...autres.values()]);
}

function card(it) {
  const land = it.format === "youtube" ? " land" : "";
  const img = it.preview
    ? '<div class="thumb' + land + '" style="background-image:url(\'' + it.preview + '\')"></div>'
    : '<div class="thumb' + land + '">apercu a venir</div>';
  const tags = it.tags.map((t) => '<span class="tag' + (t === "commun" ? " commun" : "") + '">' + esc(t) + "</span>").join("");
  const cmd = "npx hyperframes add " + it.name;
  return "<div class=card>" + img + '<div class=body><div class=name>' + esc(it.name) + '</div><div class=title>' + esc(it.title) +
    '</div><div class=desc>' + esc(it.description) + '</div><div class=tags>' + tags +
    '</div><div class=cmd><code>' + cmd + '</code><button class=copy data-c="' + cmd + '">copier</button></div></div></div>';
}

function groupe({ label, items: list }) {
  const cartes = list.map(card).join("");
  return '<div class=groupe><h3>' + esc(label) + '<span class=n>' + list.length + " bloc" + (list.length > 1 ? "s" : "") + "</span></h3>" +
    (cartes ? '<div class=grid>' + cartes + "</div>" : '<p class=empty>Aucun bloc pour ce format.</p>') + "</div>";
}

function section(titre, couleur, list, note) {
  return "<section><h2><span class=dot style=\"background:" + couleur + "\"></span>" + titre +
    '<span class=n>' + list.length + " blocs</span></h2>" + (note ? '<p class=note>' + note + "</p>" : "") +
    groupesDe(list).map(groupe).join("") + "</section>";
}

function render() {
  const list = items.filter((i) => (!q || (i.name + " " + i.title + " " + i.description + " " + i.tags.join(" ")).toLowerCase().includes(q)));
  const commun = list.filter((i) => i.commun);
  const meg = list.filter((i) => i.brand === "MEG");
  const dss = list.filter((i) => i.brand === "DSS");
  const met = (quel) => filter === "ALL" || filter === quel;
  let html = "";
  if (met("COMMUN")) html += section("Commun (MEG + DSS)", "var(--commun)", commun,
    "Blocs montes par MEG et par DSS (tag commun) — ils restent aussi listes dans leur marque.");
  if (met("MEG")) html += section("MEG", "var(--meg)", meg);
  if (met("DSS")) html += section("DSS Real Estate", "var(--dss)", dss);
  document.getElementById("out").innerHTML = html || '<p class=empty>Aucun bloc pour ce filtre.</p>';
}

async function load() {
  // 1 seul fichier : docs/catalog.json (regenere a chaque publication)
  const data = await (await fetch(new URL("catalog.json", BASE), { cache: "no-store" })).json();
  items = data.items.map((it) => ({
    ...it,
    preview: it.preview ? new URL("../" + it.preview, BASE).href : null,
  }));
  const communs = items.filter((i) => i.commun).length;
  document.getElementById("st").textContent = items.length + " blocs - " + communs + " communs - " + new Date().toLocaleTimeString("fr-FR");
  render();
}

document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.f; render();
});
document.getElementById("q").oninput = (e) => { q = e.target.value.toLowerCase(); render(); };
document.addEventListener("click", (e) => {
  const b = e.target.closest(".copy"); if (!b) return;
  navigator.clipboard.writeText(b.dataset.c);
  b.textContent = "copie"; setTimeout(() => b.textContent = "copier", 1200);
});
load();
// Catalogue local (node scripts/catalog.mjs) : la page se rafraichit seule.
if (location.hostname === "localhost" || location.hostname === "127.0.0.1") setInterval(load, 15000);
</script>
</body>
</html>

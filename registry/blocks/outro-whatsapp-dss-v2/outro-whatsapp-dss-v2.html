        <div data-hf-id="hf-owa-doigt" id="owa-doigt" data-layout-allow-overflow=""></div>
        </div>
        <div data-hf-id="hf-owa-grain" id="owa-grain"></div>
      </div>
    </div>
    <script>
      (() => {
        // ===== VARIABLES DU GABARIT outro-whatsapp-dss-v2 : textes par clip (+ <img> de #owa-photos, url de #owa-ambiance, data-duration) =====
        // photos : jamais ici (v2) : les <img class="owa-photo"> du HTML, la plus forte en 1re (c'est la 1re frame)
        const V = {
          sujet: "Nuvana", promoteur: "by Wadan",               // titre du sujet dans la bulle (promoteur facultatif : "")
          lieu: "Dubai Islands", repere: "Livraison T3 2027",    // ligne repere (repere facultatif : "")
          kicker: "ÉCRIVEZ-MOI SUR",
          appel1: "Ce projet vous intéresse ?", appel2: "Écrivez-moi, je vous réponds", motOr: "Écrivez-moi",
          message: "Bonjour Salimou, Nuvana m’intéresse",      // ce que le viewer enverrait
          numero: "+971 52 480 4972",                            // confirme par Mohamed le 13/10/2026, toujours celui-ci
          signe: "Salimou · DSS"                                 // exactement
        };
        // ===== fin des variables =====
        const R = "owa-";
        const $ = id => document.getElementById(R + id);
        const D = Math.min(7, Math.max(5, Number($("racine").getAttribute("data-duration")) || 7));

        // textes
        $("kicker-t").textContent = V.kicker;
        $("numero").textContent = V.numero;
        $("wa").setAttribute("data-lien", "https://wa.me/" + V.numero.replace(/\D/g, ""));
        const sg = V.signe.split(" · "), nom = $("nom"); nom.textContent = "";
        const nb = document.createElement("b"); nb.textContent = sg[0]; nom.append(nb, sg[1] ? " · " + sg[1] : "");
        const sj = $("sujet"); sj.textContent = V.sujet;
        if (V.promoteur) { const e = document.createElement("em"); e.textContent = V.promoteur; sj.append(e); }
        const rp = $("repere-t"); rp.textContent = V.lieu;
        if (V.repere) { const b = document.createElement("b"); b.textContent = V.repere; rp.append("  ·  ", b); }
        $("message").textContent = V.message;
        function ecrire(el, texte, mot) {
          el.textContent = ""; const i = mot ? texte.indexOf(mot) : -1;
          if (i < 0) { el.textContent = texte; return; }
          const em = document.createElement("em"); em.textContent = mot;
          el.append(texte.slice(0, i), em, texte.slice(i + mot.length));
        }
        const s1 = document.querySelector("#" + R + "l1 span"), s2 = document.querySelector("#" + R + "l2 span");
        ecrire(s1, V.appel1, V.motOr); ecrire(s2, V.appel2, V.motOr);
        // 2 lignes a la meme taille, 960 px max ; message et sujet ajustes a leur bulle
        function ajuster() {
          for (const s of [s1, s2]) s.style.fontSize = "";
          const w = Math.max(s1.offsetWidth, s2.offsetWidth);
          if (w > 960) { const f = (76 * 960 / w).toFixed(1) + "px"; s1.style.fontSize = f; s2.style.fontSize = f; }
          const m = $("message"); m.style.fontSize = ""; if (m.offsetWidth > 800) m.style.fontSize = (33 * 800 / m.offsetWidth).toFixed(1) + "px";
          sj.style.fontSize = ""; if (sj.offsetWidth > 652) sj.style.fontSize = (48 * 652 / sj.offsetWidth).toFixed(1) + "px";
        }
        ajuster(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajuster);

        // photos du sujet dans la bulle : les <img> statiques du HTML (v2 : un chemin pose en JS n'est pas reecrit par le chargeur de
        // sous-composition, bulle noire) ; l'ambiance garde l'url de son <style>
        const photos = Array.from($("photos").querySelectorAll("." + R + "photo")).slice(0, 4);

        const tl = gsap.timeline({ paused: true });
        // REGLE 1re FRAME : aucun fromTo qui part d'une opacite 0 sur un element visible a 0 s ; tout est deja pose a t = 0.

        // photos : Ken Burns des 0 s, fondu enchaine de 0.5 s, partage egal de la duree
        const n = photos.length, seg = D / n;
        photos.forEach((el, i) => {
          const debut = i ? i * seg - 0.25 : 0, fin = i < n - 1 ? (i + 1) * seg + 0.25 : D;
          if (i) tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut", immediateRender: false }, debut);
          tl.fromTo(el, { scale: i % 2 ? 1.12 : 1.02 }, { scale: i % 2 ? 1.03 : 1.12, duration: fin - debut, ease: "sine.inOut", immediateRender: !i }, debut);
        });
        tl.fromTo("#" + R + "ambiance", { scale: 1 }, { scale: 1.08, duration: D, ease: "sine.inOut" }, 0);

        // le doigt part de la photo du sujet et glisse vers le bouton (courbe : x et y avec 2 courbes differentes)
        const DX0 = 905, DY0 = 1150, DX1 = 760, DY1 = 1564;
        tl.set("#" + R + "doigt", { x: DX0, y: DY0, scale: 0.6, opacity: 0 }, 0);   // le pointeur seul se pose (0,12 s), tout le contenu est deja la
        tl.to("#" + R + "doigt", { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2)" }, 0.12);
        tl.to("#" + R + "doigt", { x: DX1, duration: 0.75, ease: "power1.inOut" }, 0.3);
        tl.to("#" + R + "doigt", { y: DY1, duration: 0.75, ease: "power2.in" }, 0.3);
        // appui sur le bouton
        tl.to("#" + R + "doigt", { scale: 0.78, duration: 0.1, ease: "power1.in" }, 1.05);
        tl.to("#" + R + "wa", { scale: 0.965, duration: 0.1, ease: "power1.in" }, 1.05);
        tl.to("#" + R + "wa", { scale: 1, duration: 0.18, ease: "power2.out" }, 1.15);
        tl.to("#" + R + "doigt", { scale: 1.25, opacity: 0, duration: 0.35, ease: "power1.out" }, 1.18);
        // message envoye : ✓ puis ✓✓ puis lu (bleu), puis Salimou ecrit…
        tl.set("#" + R + "coche1", { opacity: 0 }, 1.2);
        tl.set("#" + R + "coche2", { opacity: 1 }, 1.2);
        tl.fromTo("#" + R + "envoye", { scale: 1 }, { scale: 1.035, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "100% 50%" }, 1.2);
        tl.set("#" + R + "coche2", { opacity: 0 }, 1.75);
        tl.set("#" + R + "lu", { opacity: 1 }, 1.75);
        tl.to("#" + R + "en-ligne", { opacity: 0, duration: 0.15 }, 2.15);
        tl.to("#" + R + "ecrit", { opacity: 1, duration: 0.15 }, 2.2);
        for (let t = 2.3, k = 0; t < D - 0.3; t += 0.9, k++) {
          [1, 2, 3].forEach(j => tl.to("#" + R + "p" + j, { y: -8, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t + (j - 1) * 0.12));
        }
        // halo du bouton qui respire, ondes qui partent du bouton, reflet
        tl.fromTo("#" + R + "halo", { opacity: 0.75 }, { opacity: 1, scale: 1.06, duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor(D / 0.6) - 1), ease: "sine.inOut" }, 0);
        const ondes = [1.12]; for (let t = 2.9; t < D - 0.6; t += 1.8) ondes.push(t);
        ondes.forEach(t => tl.fromTo("#" + R + "onde", { opacity: 0.7, scaleX: 1, scaleY: 1 }, { opacity: 0, scaleX: 1.07, scaleY: 1.4, duration: 0.8, ease: "power2.out", immediateRender: false }, t));
        tl.fromTo("#" + R + "reflet", { x: -180 }, { x: 1080, duration: 0.95, ease: "power2.inOut", immediateRender: false }, 1.6);
        if (D >= 5.5) tl.fromTo("#" + R + "reflet", { x: -180 }, { x: 1080, duration: 0.95, ease: "power2.inOut", immediateRender: false }, D - 1.9);
        tl.to({}, { duration: 0 }, D);
        window.__timelines = window.__timelines || {};
        window.__timelines["outro-whatsapp-dss-v2"] = tl;
      })();
    </script>
  </body>
</html>

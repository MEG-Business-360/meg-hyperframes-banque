<!DOCTYPE html>
<html lang="fr" data-composition-variables="[ { &quot;id&quot;: &quot;video&quot;, &quot;type&quot;: &quot;string&quot;, &quot;label&quot;: &quot;Video (segment pre-cadre visage, 1080x1920)&quot;, &quot;default&quot;: &quot;assets/frame.mp4&quot; }, { &quot;id&quot;: &quot;debut&quot;, &quot;type&quot;: &quot;number&quot;, &quot;label&quot;: &quot;Debut dans la source (s)&quot;, &quot;default&quot;: 0 }, { &quot;id&quot;: &quot;duree&quot;, &quot;type&quot;: &quot;number&quot;, &quot;label&quot;: &quot;Duree (s)&quot;, &quot;default&quot;: 5 } ]">
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
</head>
<body>
<!--
  LAYOUT « FACE » 9:16 (DSS) - composition reutilisable.
  On POSE LA VIDEO dans le placeholder : le lecteur monte cette composition avec
    data-composition-src="compositions/DSS/layout-face-9-16.html"
    data-composition-vars='{"video":"assets/frame.mp4","debut":14.93,"duree":47.3}'
  Le segment doit etre DEJA pre-cadre par ffmpeg (visage centre, 1080x1920).
-->
<template>
  <div data-hf-id="hf-k926" data-composition-id="layout-face-9-16" data-start="0" data-duration="5" data-width="1080" data-height="1920">
    <video data-hf-id="hf-yva4" id="layout-face-9-16-video" class="clip" data-start="0" data-duration="5" data-var-src="video" src="assets/frame.mp4" data-track-index="0" muted playsinline></video>
    <style>
      #layout-face-9-16-video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["layout-face-9-16"] = gsap.timeline({paused: true});
      (() => {
        const v = window.__hyperframes?.getVariables?.() || {};
        const host = document.querySelector('[data-composition-id="layout-face-9-16"]');
        if (host && v.duree) host.setAttribute('data-duration', String(v.duree));
        const vid = document.getElementById('layout-face-9-16-video');
        if (vid && v.debut) vid.setAttribute('data-media-start', String(v.debut));
      })();
    </script>
  </div>
</template>
</body>
</html>

  OUTRO WHATSAPP DSS v2 (Snap 9:16, le meme gabarit a la fin de chaque clip) — miroir vert de l'outro YouTube (outro-dss).
  Mohamed, 13/10/2026 : « des la premiere frame on voit les choses », « YouTube c'est en rouge, la c'est en vert », « une animation vers le bouton WhatsApp ».
  Concept : une conversation WhatsApp avec Salimou. A 0 s tout est deja la : logo, phrase d'appel, en-tete (portrait logo-dss.png valide +
  « Salimou · DSS »), bulle avec la CARTE DE DUBAI et le pin du lieu du clip, message du viewer, bouton WhatsApp avec le numero. Rien n'entre depuis le vide.

  REVISION DU 27/11/2026 (accord de Mohamed, seuls changements autorises sur ce gabarit valide « parfait ») :
    « Vous avez un projet a Dubai ? Contactez-nous directement sur WhatsApp, un membre de mon equipe va vous envoyer directement le projet »
      (voix Maxim, phrase adaptee au sujet du clip) ;
    « le numero ... super important » : +971 52 480 4972 en 78 px gras, chiffres vert nuit sur le vert WhatsApp (contraste 9,5:1), jamais coupe ni masque ;
    « quand la voix a fini, la carte reste 2 a 3 s » et « seules les couleurs bougent, sans gros mouvement » ;
    « il faut mettre un truc en rapport personnalise ... un projet ... il faut mettre la carte de Dubai, un truc comme ca » ;
    « il faut jamais se tromper ».
  DUREE, une seule source : data-voix-fin (fin de la voix, en s) et data-tenue (2,5 par defaut, borne 2 a 3) sur #owa-racine.
    D = min(11, voix-fin + tenue). Le script recalcule D et l'ecrit dans data-duration de #owa-racine ET de #owa-scene ;
    mettre aussi la meme valeur en dur dans ces 2 attributs (le moteur peut les lire avant le script).
  PENDANT LA VOIX (0 -> voix-fin) : doigt vers le bouton, coches puis lu, « ecrit… », zoom lent de la carte vers le pin, pin qui rebondit puis
    ondes du pin, halo du bouton qui respire, ondes et reflet du bouton. Tout mouvement est termine a voix-fin.
  TENUE (voix-fin -> D) : AUCUN mouvement de position ni d'echelle. Seules les couleurs changent : derive du degrade vert du fond (fondu d'un 2e
    degrade), lueur du bouton (opacite), halo (opacite), lueur du pin (or -> vert -> or).
  SOUS-TITRES DE LA VOIX : le moteur les pose en bas (bas de la capsule a y 1500, capsule 102 px de haut : y 1398-1500 a l'ecran).
    Le bouton finit a y 1361 a l'ecran : bande libre y 1361-1500 reservee aux sous-titres, rien d'important dedans (seulement la lueur du halo).
  CARTE : vraies donnees OpenStreetMap (ODbL, credit « © OpenStreetMap » dans la carte), construites par carte/construire_carte.py,
    source et coordonnees dans carte/preuve-carte.json. Projection equirectangulaire, cadre lon @LON0@ a @LON1@, lat @LAT0@ a @LAT1@
    (bulle 680 x 330 px). Jamais de carte dessinee a la main, jamais de pin devine : coordonnees d'un objet OSM nomme.

  AVANT DE REMPLIR, ecrire dans le compte rendu (Mohamed, 13/10/2026 : « se poser des questions sur ce qu'on montre ») :
    1) De quoi parle le clip, en 1 phrase ?
    2) Quel lieu la parole cite-t-elle (citation + seconde) ? Aucun lieu precis : pin general « Dubai » (noeud OSM 31248510), jamais un quartier invente.
    3) Quel message le viewer enverrait (V.message, court, 1re personne du viewer, vouvoiement de la voix respecte) ?

  INSTANCE PAR CLIP : copier ce fichier, remplacer « owa- » par « cNN-owa- » partout (ids, classes, data-hf-id), data-composition-id « outro-cNN »
  et la cle window.__timelines["outro-cNN"] ; puis ne modifier QUE : l'objet V (textes et V.carte), data-voix-fin (et data-tenue),
  data-duration (= D, racine et scene). Ne jamais sortir un element de #owa-zone ni changer son transform (controle_lot_snap.py : ALERTE outro hors zone sure).
  Zone sure (Mohamed, 15/10/2026 : « la safe zone pour le outro, c'est super important ») : #owa-zone (translate 91,8 px, 137,1 px, scale 0,83).
  Jamais de prix ni de nombre d'unites. Fixe : numero +971 52 480 4972 (confirme le 13/10/2026), signature exacte « Salimou · DSS ».
  Charte : ambiance verte WhatsApp (verts profonds, lueur #25D366 maitrisee), bouton #25D366, or DSS #F0CC86/#E8B65C/#B98330, creme #FCF6ED ;
  jamais d'orange ; 0 emoji ; police Cabinet Grotesk. Aucun son par defaut, jamais de musique.
  Medias : seulement ceux de la banque (polices, logo-dss.png, grain.png) ; la carte est un SVG en ligne, aucune image externe.
-->

                <div data-hf-id="hf-owa-repere" id="owa-repere"><svg data-hf-id="hf-owa-pin" viewBox="0 0 256 256"><path data-hf-id="hf-owa-pin-p" d="@PIN@"/></svg><span data-hf-id="hf-owa-repere-t" id="owa-repere-t"></span></div>
              </div>
            </div>
            <div data-hf-id="hf-owa-envoye" id="owa-envoye">
              <span data-hf-id="hf-owa-message" id="owa-message"></span>
              <div data-hf-id="hf-owa-coches" id="owa-coches">
                <svg data-hf-id="hf-owa-coche1" id="owa-coche1" viewBox="0 0 40 26"><path data-hf-id="hf-owa-coche1-p" d="M4 14l7 7L25 5" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <svg data-hf-id="hf-owa-coche2" id="owa-coche2" viewBox="0 0 40 26"><path data-hf-id="hf-owa-coche2-p" d="M4 14l7 7L25 5M17 19l2 2L33 5" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <svg data-hf-id="hf-owa-lu" id="owa-lu" viewBox="0 0 40 26"><path data-hf-id="hf-owa-lu-p" d="M4 14l7 7L25 5M17 19l2 2L33 5" fill="none" stroke="#53BDEB" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
            </div>
          </div>
        </div>

        <div data-hf-id="hf-owa-onde" id="owa-onde"></div>
        <div data-hf-id="hf-owa-wa" id="owa-wa">
          <div data-hf-id="hf-owa-wa-lueur" id="owa-wa-lueur"></div>
          <div data-hf-id="hf-owa-zone-reflet" id="owa-zone-reflet" data-layout-allow-overflow=""><div data-hf-id="hf-owa-reflet" id="owa-reflet" data-layout-allow-overflow=""></div></div>
          <svg data-hf-id="hf-owa-wa-logo" viewBox="0 0 256 256"><path data-hf-id="hf-owa-wa-logo-p" d="@WA@"/></svg>
          <span data-hf-id="hf-owa-numero" id="owa-numero"></span>
        </div>
        <div data-hf-id="hf-owa-doigt" id="owa-doigt" data-layout-allow-overflow=""></div>
        </div>
        <div data-hf-id="hf-owa-grain" id="owa-grain"></div>
      </div>
    </div>
    <script>
      (() => {
        // ===== VARIABLES DU GABARIT outro-whatsapp-dss-v2 : textes et carte par clip (+ data-voix-fin, data-tenue, data-duration) =====
        const V = {
          sujet: "Weston", promoteur: "",                        // titre du sujet dans la bulle (promoteur facultatif : "")
          lieu: "Dubailand Residence Complex", repere: "",       // ligne repere (repere facultatif : "")
          kicker: "CONTACTEZ-NOUS SUR",
          appel1: "Le projet Weston vous intéresse ?", appel2: "Écrivez-nous sur WhatsApp", motOr: "WhatsApp",
          message: "Bonjour, je veux le projet Weston",          // ce que le viewer enverrait
          numero: "+971 52 480 4972",                            // confirme par Mohamed le 13/10/2026, toujours celui-ci
          signe: "Salimou · DSS",                                // exactement
          // carte : coordonnees d'un objet OSM nomme (carte/preuve-carte.json), jamais devinees ; projet "" si aucun projet etabli
          // autres : reperes secondaires cites par la parole, [] sinon ({ lat, lon, nom }) ; place : "" (auto) ou dessous|dessus|droite|gauche
          carte: { lat: 25.0926, lon: 55.380771, etiquette: "Dubailand Residence Complex", projet: "Weston", autres: [], place: "" }
        };
        // ===== fin des variables =====
        const R = "owa-";
        const $ = id => document.getElementById(R + id);
        const racine = $("racine");
        // duree : une seule source (data-voix-fin + data-tenue), recopiee sur la racine et la scene
        const VF = Math.max(2.5, Number(racine.getAttribute("data-voix-fin")) || 5.5);
        const TENUE = Math.min(3, Math.max(2, Number(racine.getAttribute("data-tenue")) || 2.5));
        const D = Math.round(Math.min(11, VF + TENUE) * 1000) / 1000;
        const FV = Math.min(VF, D);   // fin de tout mouvement
        racine.setAttribute("data-duration", String(D)); $("scene").setAttribute("data-duration", String(D));

        // textes
        $("kicker-t").textContent = V.kicker;
        $("numero").textContent = V.numero;
        $("wa").setAttribute("data-lien", "https://wa.me/" + V.numero.replace(/\D/g, ""));
        const sg = V.signe.split(" · "), nom = $("nom"); nom.textContent = "";
        const nb = document.createElement("b"); nb.textContent = sg[0]; nom.append(nb, sg[1] ? " · " + sg[1] : "");
        const sj = $("sujet"); sj.textContent = V.sujet;
        if (V.promoteur) { const e = document.createElement("em"); e.textContent = V.promoteur; sj.append(e); }
        const rp = $("repere-t"); rp.textContent = V.lieu;
        if (V.repere) { const b = document.createElement("b"); b.textContent = V.repere; rp.append("  ·  ", b); }
        $("message").textContent = V.message;
        function ecrire(el, texte, mot) {
          el.textContent = ""; const i = mot ? texte.indexOf(mot) : -1;
          if (i < 0) { el.textContent = texte; return; }
          const em = document.createElement("em"); em.textContent = mot;
          el.append(texte.slice(0, i), em, texte.slice(i + mot.length));
        }
        const s1 = document.querySelector("#" + R + "l1 span"), s2 = document.querySelector("#" + R + "l2 span");
        ecrire(s1, V.appel1, V.motOr); ecrire(s2, V.appel2, V.motOr);

        // carte : projection du cadre OSM (equirectangulaire) vers la bulle 680 x 330
        const CADRE = { lon0: @LON0@, lon1: @LON1@, lat0: @LAT0@, lat1: @LAT1@, w: 680, h: 330 };
        const proj = (lat, lon) => [(lon - CADRE.lon0) / (CADRE.lon1 - CADRE.lon0) * CADRE.w, (CADRE.lat1 - lat) / (CADRE.lat1 - CADRE.lat0) * CADRE.h];
        const C = V.carte;
        const [PX, PY] = proj(C.lat, C.lon);
        const pin = $("pin"); pin.style.left = PX.toFixed(1) + "px"; pin.style.top = PY.toFixed(1) + "px";
        $("plan").style.transformOrigin = PX.toFixed(1) + "px " + PY.toFixed(1) + "px";
        const ep = $("etiquette-projet"), el = $("etiquette-lieu"), et = $("etiquette");
        ep.textContent = C.projet || ""; ep.style.display = C.projet ? "" : "none"; el.textContent = C.etiquette;
        (C.autres || []).forEach(a => {
          const [ax, ay] = proj(a.lat, a.lon), d = document.createElement("div");
          d.className = R + "autre"; d.style.left = ax.toFixed(1) + "px"; d.style.top = ay.toFixed(1) + "px";
          const i = document.createElement("i"), s = document.createElement("span"); s.textContent = a.nom;
          if (ax > CADRE.w * 0.62) s.style.right = "14px"; else s.style.left = "14px";
          d.append(i, s); $("autres").append(d);
        });
        // etiquette : 1re place libre parmi dessous, dessus, droite, gauche (ou V.carte.place), dans la carte a 18 px du bord,
        // sans couvrir un repere secondaire ; jamais sur le pin
        function placerEtiquette() {
          const s = et.style.transform ? 440 / et.offsetWidth : 1, w = et.offsetWidth * s, h = et.offsetHeight * s, M = 18;
          const pos = {
            dessous: [PX - w / 2, PY + 20], dessus: [PX - w / 2, PY - 66 - h],
            droite: [PX + 34, PY - 30 - h / 2], gauche: [PX - 34 - w, PY - 30 - h / 2]
          };
          const ordre = C.place ? [C.place] : ["dessous", "dessus", "droite", "gauche"];
          const pts = (C.autres || []).map(a => proj(a.lat, a.lon));
          let choix = null;
          for (const k of ordre) {
            const [x, y] = pos[k];
            const dedans = x >= M && y >= M && x + w <= CADRE.w - M && y + h <= CADRE.h - 30;
            const libre = pts.every(([ax, ay]) => ax < x - 16 || ax > x + w + 16 || ay < y - 16 || ay > y + h + 16);
            if (dedans && libre) { choix = [x, y]; break; }
          }
          if (!choix) { const [x, y] = pos[ordre[0]]; choix = [Math.min(Math.max(x, M), CADRE.w - M - w), Math.min(Math.max(y, M), CADRE.h - 30 - h)]; }
          et.style.left = choix[0].toFixed(1) + "px"; et.style.top = choix[1].toFixed(1) + "px";
        }

        // 2 lignes a la meme taille, 960 px max ; message, sujet, numero et etiquette ajustes a leur place
        function ajuster() {
          for (const s of [s1, s2]) s.style.fontSize = "";
          const w = Math.max(s1.offsetWidth, s2.offsetWidth);
          if (w > 960) { const f = (76 * 960 / w).toFixed(1) + "px"; s1.style.fontSize = f; s2.style.fontSize = f; }
          const m = $("message"); m.style.fontSize = ""; if (m.offsetWidth > 800) m.style.fontSize = (33 * 800 / m.offsetWidth).toFixed(1) + "px";
          sj.style.fontSize = ""; if (sj.offsetWidth > 652) sj.style.fontSize = (48 * 652 / sj.offsetWidth).toFixed(1) + "px";
          rp.style.fontSize = ""; if (rp.offsetWidth > 610) rp.style.fontSize = (29 * 610 / rp.offsetWidth).toFixed(1) + "px";
          const nu = $("numero"); nu.style.fontSize = ""; if (nu.offsetWidth > 740) nu.style.fontSize = (78 * 740 / nu.offsetWidth).toFixed(1) + "px";
          et.style.transform = ""; if (et.offsetWidth > 440) { et.style.transformOrigin = "0 0"; et.style.transform = "scale(" + (440 / et.offsetWidth).toFixed(3) + ")"; }
          placerEtiquette();
        }
        ajuster(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajuster);

        const tl = gsap.timeline({ paused: true });
        const S = "#" + R;
        // REGLE 1re FRAME : aucun fromTo qui part d'une opacite 0 sur un element visible a 0 s ; tout est deja pose a t = 0.
        // REGLE TENUE (27/11) : toute tween de position ou d'echelle se termine au plus tard a FV (= voix-fin).

        // ===== PENDANT LA VOIX =====
        // carte : zoom lent vers le pin (1 -> 1,07), fini a voix-fin
        tl.fromTo(S + "plan", { scale: 1 }, { scale: 1.07, duration: FV, ease: "sine.inOut" }, 0);
        tl.fromTo(S + "ambiance", { scale: 1 }, { scale: 1.08, duration: FV, ease: "sine.inOut" }, 0);
        // pin : petit rebond, puis ondes regulieres jusqu'a voix-fin
        tl.to(S + "pin-icone", { y: -16, duration: 0.2, ease: "power2.out" }, 0.25);
        tl.to(S + "pin-icone", { y: 0, duration: 0.45, ease: "bounce.out" }, 0.45);
        for (let t = 0.55; t + 1.1 <= FV - 0.1; t += 1.3)
          tl.fromTo(S + "pin-onde", { scale: 0.5, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, t);

        // le doigt part de la carte et glisse vers le bouton
        const DX0 = 905, DY0 = 980, DX1 = 760, DY1 = 1404;
        tl.set(S + "doigt", { x: DX0, y: DY0, scale: 0.6, opacity: 0 }, 0);
        tl.to(S + "doigt", { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2)" }, 0.12);
        tl.to(S + "doigt", { x: DX1, duration: 0.75, ease: "power1.inOut" }, 0.3);
        tl.to(S + "doigt", { y: DY1, duration: 0.75, ease: "power2.in" }, 0.3);
        tl.to(S + "doigt", { scale: 0.78, duration: 0.1, ease: "power1.in" }, 1.05);
        tl.to(S + "wa", { scale: 0.965, duration: 0.1, ease: "power1.in" }, 1.05);
        tl.to(S + "wa", { scale: 1, duration: 0.18, ease: "power2.out" }, 1.15);
        tl.to(S + "doigt", { scale: 1.25, opacity: 0, duration: 0.35, ease: "power1.out" }, 1.18);
        // message envoye : coche, double coche, lu (bleu), puis Salimou ecrit…
        tl.set(S + "coche1", { opacity: 0 }, 1.2);
        tl.set(S + "coche2", { opacity: 1 }, 1.2);
        tl.fromTo(S + "envoye", { scale: 1 }, { scale: 1.035, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "100% 50%" }, 1.2);
        tl.set(S + "coche2", { opacity: 0 }, 1.75);
        tl.set(S + "lu", { opacity: 1 }, 1.75);
        tl.to(S + "en-ligne", { opacity: 0, duration: 0.15 }, 2.15);
        tl.to(S + "ecrit", { opacity: 1, duration: 0.15 }, 2.2);
        for (let t = 2.3; t + 0.24 + 0.36 <= FV; t += 0.9)
          [1, 2, 3].forEach(j => tl.to(S + "p" + j, { y: -8, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t + (j - 1) * 0.12));
        // halo du bouton qui respire (nombre pair d'allers-retours : revient a l'echelle 1 avant voix-fin), ondes, reflet
        const nHalo = Math.max(2, 2 * Math.floor(FV / 1.2));
        tl.fromTo(S + "halo", { opacity: 0.75, scale: 1 }, { opacity: 1, scale: 1.06, duration: FV / nHalo, yoyo: true, repeat: nHalo - 1, ease: "sine.inOut" }, 0);
        const ondes = [1.12]; for (let t = 2.9; t + 0.8 <= FV - 0.1; t += 1.8) ondes.push(t);
        ondes.forEach(t => tl.fromTo(S + "onde", { opacity: 0.7, scaleX: 1, scaleY: 1 }, { opacity: 0, scaleX: 1.07, scaleY: 1.4, duration: 0.8, ease: "power2.out", immediateRender: false }, t));
        tl.fromTo(S + "reflet", { x: -180 }, { x: 1080, duration: 0.95, ease: "power2.inOut", immediateRender: false }, 1.6);
        if (FV >= 5) tl.fromTo(S + "reflet", { x: -180 }, { x: 1080, duration: 0.95, ease: "power2.inOut", immediateRender: false }, FV - 1.15);

        // ===== TENUE (voix-fin -> D) : couleurs seules =====
        const T = D - FV;
        if (T > 0) {
          tl.fromTo(S + "fond2", { opacity: 0 }, { opacity: 0.9, duration: T, ease: "sine.inOut", immediateRender: false }, FV);
          tl.fromTo(S + "wa-lueur", { opacity: 0 }, { opacity: 0.55, duration: T / 2, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, FV);
          tl.fromTo(S + "halo", { opacity: 0.75 }, { opacity: 0.4, duration: T / 2, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, FV);
          tl.fromTo(S + "pin-or", { opacity: 1 }, { opacity: 0.2, duration: T / 2, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, FV);
          tl.fromTo(S + "pin-vert", { opacity: 0 }, { opacity: 1, duration: T / 2, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, FV);
        }
        tl.to({}, { duration: 0 }, D);
        window.__timelines = window.__timelines || {};
        window.__timelines["outro-whatsapp-dss-v2"] = tl;
      })();
    </script>

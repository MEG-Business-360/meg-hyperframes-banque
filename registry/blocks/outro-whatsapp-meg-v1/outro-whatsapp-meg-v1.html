  Concept : une conversation WhatsApp avec Mohamed. A 0 s tout est deja la : logo MEG, phrase titre, en-tete Mohamed (vraie photo ronde +
  « Mohamed · MEG Business 360 »), message du visiteur (lu), reponse de Mohamed, gros bouton vert WhatsApp avec le numero. Rien n'entre depuis le vide.
  Pendant : la photo de Mohamed et le fond respirent (Ken Burns leger), les bulles reagissent, Mohamed « ecrit… », un doigt appuie 2 fois
  sur le bouton (enfoncement + onde), le halo vert pulse, un reflet balaie le bouton. Toute l'animation converge vers le bouton.

  PARAMETRES (seuls champs a changer) — 2 voies equivalentes :
    a) placeholders : remplacer la valeur de la ligne marquee @MESSAGE@, @TITRE@, @MOT_OR@ ou @REPONSE@ dans l'objet V du script
       ET le "default" de la meme variable dans data-composition-variables (<html>) ;
    b) variables HyperFrames a la racine : npx hyperframes render --variables '{"message":"...","titre":"..."}' (rendu autonome du bloc).
       (En sous-composition, data-variable-values n'est pas applique en HyperFrames 0.8.50 : scripts/tests/variables/README.md ; utiliser a.)
    @MESSAGE@ : message du visiteur, 1re personne, court (defaut « Je veux créer mon organisme de formation ») ; 2 lignes max, la taille s'ajuste.
    @TITRE@   : phrase titre (defaut « Écrivez-nous sur WhatsApp ») ; 2 lignes max, la taille s'ajuste.
    @MOT_OR@  : mot du titre en or fonce (defaut « WhatsApp » ; "" = aucun).
    @REPONSE@ : reponse de Mohamed, courte, chaleureuse, vouvoiement (defaut « Avec plaisir ! Racontez-moi votre projet, je vous réponds. »).
  Fixe pour toutes les videos : numero +33 6 52 52 48 21, signature exacte « Mohamed · MEG Business 360 », photo assets/outro-meg/mohamed.jpg
  (vraie photo du site megbusiness360.com, seul visage autorise), logo officiel meg-logo-dark.png sur creme.
  INSTANCE dans un projet : copier ce fichier (ou hyperframes add outro-whatsapp-meg-v1), remplacer « owa- » par « <id>-owa- » si plusieurs outros
  cohabitent (ids, classes, data-hf-id, cle window.__timelines), puis ne changer que les parametres ci-dessus.

  jamais de texte fonce sur or ; aucun texte sous 20 px. Aucun son.
  ZONE SURE : tout le contenu (logo, titre, conversation, bouton, doigt) dans #owa-zone = x 64-1016, y 285-1580 (marges 64 px, Instagram/Snap/TikTok) ;

    <script>
      (() => {
        // ===== VARIABLES DU GABARIT outro-whatsapp-meg-v1 (placeholders @…@, voir l'en-tete) =====
        const V = {
          message: "Je veux créer mon organisme de formation",                  // @MESSAGE@
          titre: "Écrivez-nous sur WhatsApp",                                     // @TITRE@
          motOr: "WhatsApp",                                                      // @MOT_OR@
          reponse: "Avec plaisir ! Racontez-moi votre projet, je vous réponds.",  // @REPONSE@
          numero: "+33 6 52 52 48 21",                                            // fixe
          signe: "Mohamed · MEG Business 360"                                     // fixe, exactement
        };
        // ===== fin des variables =====
        try {
          const hv = window.__hyperframes && typeof window.__hyperframes.getVariables === "function" ? window.__hyperframes.getVariables() : null;
          if (hv) for (const k of ["message", "titre", "motOr", "reponse"]) if (typeof hv[k] === "string") V[k] = hv[k];
        } catch (e) { /* valeurs du gabarit */ }

        const R = "owa-";
        const $ = id => document.getElementById(R + id);
        const D = Math.min(7, Math.max(5, Number($("racine").getAttribute("data-duration")) || 7));

        // textes (espaces insecables avant ! ? : ; pour la typo francaise)
        const fr = s => String(s).replace(/ ([!?:;])/g, " $1");
        $("numero").textContent = V.numero;
        $("wa").setAttribute("data-lien", "https://wa.me/" + V.numero.replace(/\D/g, ""));
        const sg = V.signe.split(" · "), nom = $("nom"); nom.textContent = "";
        const nb = document.createElement("b"); nb.textContent = sg[0]; nom.append(nb, sg[1] ? " · " + sg[1] : "");
        $("message").textContent = fr(V.message);
        $("reponse").textContent = fr(V.reponse);
        const tt = $("titre-t"), titre = fr(V.titre), i = V.motOr ? titre.lastIndexOf(V.motOr) : -1;
        tt.textContent = "";
        if (i < 0) tt.textContent = titre;
        else { const em = document.createElement("em"); em.textContent = V.motOr; tt.append(titre.slice(0, i), em, titre.slice(i + V.motOr.length)); }

        // ajustements : titre 2 lignes max (200 px), bulles 2 lignes max, nom dans l'en-tete
        function ajuster() {
          let f = 96; tt.style.fontSize = f + "px";
          // 2 lignes au plus : on compte les lignes reelles (des lignes a 1.0 tiendraient a 3 dans 204 px)
          const lignes = () => { const rg = document.createRange(); rg.selectNodeContents(tt); return new Set(Array.from(rg.getClientRects()).filter(r => r.width > 1).map(r => Math.round(r.top + r.height / 2))).size; };
          while (f > 40 && (lignes() > 2 || tt.offsetHeight > 204 || tt.scrollWidth > 952)) { f -= 2; tt.style.fontSize = f + "px"; }
          for (const id of ["message", "reponse"]) {
            const el = $(id); let s = 38; el.style.fontSize = s + "px"; el.style.lineHeight = "1.26";
            while (s > 26 && el.offsetHeight > s * 1.26 * 2 + 2) { s -= 1; el.style.fontSize = s + "px"; }
            // la bulle epouse ses lignes (text-wrap: balance ne retrecit pas la boite)
            const b = el.parentNode; b.style.width = "";
            const rg = document.createRange(); rg.selectNodeContents(el);
            const w = Math.max(...Array.from(rg.getClientRects()).map(r => r.width));
            if (w > 0) b.style.width = Math.max(300, Math.ceil(w) + 64) + "px";
          }
          nom.style.fontSize = ""; if (nom.offsetWidth > 600) nom.style.fontSize = (42 * 600 / nom.offsetWidth).toFixed(1) + "px";
        }
        ajuster(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajuster);

        const tl = gsap.timeline({ paused: true });
        // REGLE 1re FRAME : aucun fromTo qui part d'une opacite 0 sur un element visible a 0 s ; tout est deja pose a t = 0.

        // Ken Burns : photo de Mohamed, fond et halos or
        tl.fromTo("#" + R + "visage", { scale: 1.14 }, { scale: 1.26, duration: D, ease: "sine.inOut", immediateRender: true }, 0);
        tl.fromTo("#" + R + "fond", { scale: 1.0 }, { scale: 1.06, duration: D, ease: "sine.inOut", immediateRender: true }, 0);
        tl.fromTo("#" + R + "tache-1", { x: 0, y: 0 }, { x: 120, y: 60, duration: D, ease: "sine.inOut" }, 0);
        tl.fromTo("#" + R + "tache-2", { x: 0, y: 0 }, { x: -110, y: -70, duration: D, ease: "sine.inOut" }, 0);
        tl.fromTo("#" + R + "tache-3", { x: 0, y: 0 }, { x: 90, y: -50, duration: D, ease: "sine.inOut" }, 0);
        tl.fromTo("#" + R + "tache-4", { x: 0, y: 0 }, { x: -80, y: 40, duration: D, ease: "sine.inOut" }, 0);
        // la carte flotte doucement
        tl.fromTo("#" + R + "chat", { y: 0 }, { y: -8, duration: D / 2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);

        // doigt : 1er appui (part de la reponse de Mohamed, glisse vers le bouton)
        const doigt = "#" + R + "doigt", appui = "#" + R + "appui", wa = "#" + R + "wa";
        function presser(t0, x0, y0, x1, y1) {
          tl.set(doigt, { x: x0, y: y0, scale: 0.6, opacity: 0 }, t0);
          tl.to(doigt, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2)" }, t0 + 0.02);
          tl.to(doigt, { x: x1, duration: 0.75, ease: "power1.inOut" }, t0 + 0.2);
          tl.to(doigt, { y: y1, duration: 0.75, ease: "power2.in" }, t0 + 0.2);
          const tp = t0 + 0.95;
          tl.to(doigt, { scale: 0.78, duration: 0.1, ease: "power1.in" }, tp);
          tl.to(wa, { scale: 0.96, duration: 0.1, ease: "power1.in" }, tp);
          tl.to(wa, { scale: 1, duration: 0.2, ease: "power2.out" }, tp + 0.1);
          tl.set(appui, { x: x1, y: y1 }, tp);
          tl.fromTo(appui, { opacity: 0.9, scale: 0.8 }, { opacity: 0, scale: 2.6, duration: 0.55, ease: "power2.out", immediateRender: false }, tp + 0.05);
          tl.fromTo("#" + R + "onde", { opacity: 0.75, scaleX: 1, scaleY: 1 }, { opacity: 0, scaleX: 1.07, scaleY: 1.45, duration: 0.8, ease: "power2.out", immediateRender: false }, tp + 0.05);
          tl.to(doigt, { scale: 1.2, opacity: 0, duration: 0.35, ease: "power1.out" }, tp + 0.15);
          return tp;
        }
        gsap.set(doigt, { x: 760, y: 930, scale: 0.6, opacity: 0 });   // le pointeur seul se pose (0,12 s), tout le contenu est deja la
        gsap.set(appui, { x: 215, y: 1158, opacity: 0 });
        const p1 = presser(0.1, 760, 930, 215, 1158);   // appui sur le logo WhatsApp du bouton : le numero reste lisible
        // bulles qui reagissent a l'appui
        tl.fromTo("#" + R + "envoye", { scale: 1 }, { scale: 1.035, duration: 0.14, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, p1 + 0.15);
        tl.fromTo("#" + R + "recu", { scale: 1 }, { scale: 1.03, duration: 0.14, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, p1 + 0.45);
        // Mohamed ecrit…
        tl.to("#" + R + "en-ligne", { opacity: 0, duration: 0.15 }, 2.2);
        tl.to("#" + R + "ecrit", { opacity: 1, duration: 0.15 }, 2.25);
        for (let t = 2.35; t < D - 0.3; t += 0.9) {
          [1, 2, 3].forEach(j => tl.to("#" + R + "p" + j, { y: -8, duration: 0.18, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t + (j - 1) * 0.12));
        }
        // 2e appui
        if (D >= 6) presser(D - 2.75, 330, 900, 838, 1158);   // 2e appui a droite du numero, sans le couvrir
        // halo du bouton qui respire, ondes, reflets
        tl.fromTo("#" + R + "halo", { opacity: 0.7, scale: 1 }, { opacity: 1, scale: 1.06, duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor(D / 0.6) - 1), ease: "sine.inOut" }, 0);
        for (let t = 2.9; t < D - 3; t += 1.8) tl.fromTo("#" + R + "onde", { opacity: 0.6, scaleX: 1, scaleY: 1 }, { opacity: 0, scaleX: 1.06, scaleY: 1.4, duration: 0.8, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo(wa, { scale: 1 }, { scale: 1.025, duration: 0.45, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, 2.6);
        tl.fromTo(wa, { scale: 1 }, { scale: 1.025, duration: 0.45, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, D - 0.95);
        tl.fromTo("#" + R + "reflet", { x: -180 }, { x: 1080, duration: 0.95, ease: "power2.inOut", immediateRender: false }, 1.5);
        tl.fromTo("#" + R + "reflet", { x: -180 }, { x: 1080, duration: 0.95, ease: "power2.inOut", immediateRender: false }, 3.4);
        tl.to({}, { duration: 0 }, D);
        window.__timelines = window.__timelines || {};
        window.__timelines["outro-whatsapp-meg-v1"] = tl;
      })();
    </script>
  </body>

<!--
  OUTRO WHATSAPP MEG (9:16, 7 s, 60 fps, meme gabarit a la fin de chaque video MEG Business 360) — quasi-clone de outro-whatsapp-dss-v2.
  Mohamed, 10/11/2026 (v1 creme refusee) : « pratiquement pareil que DSS, avec mon truc, le logo MEG ». Meme mecanique, meme ambiance
  verte WhatsApp, meme point de toucher rond ; seuls la marque (logo MEG, or MEG, creme #FFFCD6) et les textes changent. Jamais de visage.
  A 0 s tout est deja la : logo MEG, kicker, titre 2 lignes, en-tete « MEG Business 360 » (avatar = logo MEG, en ligne), bulle photo du sujet,
  message du visiteur, bouton WhatsApp « Envoyer un message ». Rien n'entre depuis le vide.
  Pendant : photos du sujet en Ken Burns (fondus), point de toucher rond (0,12 s) qui glisse en courbe et presse le bouton (1,05 s),
  coches 1 -> 2 (1,2 s) -> lues bleues (1,75 s), « en ligne » -> « écrit… » + bulle « ••• » (2,2 s), reponse de l'equipe (3,4 s),
  2e appui qui part de la reponse vers le bouton (5,55 s), halo qui respire, ondes, reflets. Toute l'animation converge vers le bouton.

  VERSION VALIDEE SOLEAD (20/11/2026) : prospect a GAUCHE (message), reponse MEG a DROITE avec le logo MEG dans la bulle, reponse par defaut
  « Top, je vous appelle dans quelques minutes 🤝 », message par defaut « Je viens de voir votre réalisation, moi aussi je souhaite obtenir mon
  accès au portail [service]. » ([service] = EDOF, Qualiopi... a ecrire dans message). VIGNETTE de bulle reutilisable #owa-vignette : texte
  a gauche (variables vTitre / vSous), illustration a gauche dans #owa-illu = SEUL bloc a changer selon le sujet, avec mini animation ;
  jamais de capture, de rayons/soleil ni d'image floue. Couleurs (fond vert, « Écrivez-nous » or) inchangees.
  PARAMETRES
    - textes : data-composition-variables ci-dessus (default = valeur du gabarit) ET objet V du script (meme valeur) ;
      rendu autonome : npx hyperframes render --variables '{"message":"...","reponse":"..."}'.
      (En sous-composition, data-variable-values n'est pas applique : scripts/tests/variables/README.md ; modifier V et les default.)
    - photos (1 a 4) : les <img class="owa-photo"> de #owa-photos, fichiers assets/outro-meg/sujet-1.jpg.. fournis par le PROJET
      (jamais commites dans la banque, rien du client dans Git), cadres 680 x 372 (rapport 1,83), la plus forte en 1re (c'est la 1re frame) ;
      object-position et transform-origin = le meme cadrage ; opacity:1 sur la 1re, 0 sur les suivantes ; jamais de photo posee en JS
      (le chargeur de sous-composition ne reecrit pas un chemin pose en JS : bulle noire, cf. outro-whatsapp-dss-v2).
    - ambiance : url de #owa-ambiance dans le <style> = la 1re photo.
    - duree : data-duration de #owa-racine ET de #owa-scene (meme valeur, 6 a 7 ; 7 par defaut).
  Fixe (v4) : bouton « Envoyer un message » sans numero, nom « MEG Business 360 », avatar = logo officiel meg-logo-light.png (fond sombre), kicker « ÉCRIVEZ-NOUS SUR WhatsApp ».
  INSTANCE dans un projet : copier ce fichier (ou hyperframes add outro-whatsapp-meg-v1), remplacer « owa- » par « <id>-owa- » si plusieurs
  outros cohabitent (ids, classes, data-hf-id, cle window.__timelines), puis ne changer que les parametres ci-dessus.
  Charte : ambiance verte WhatsApp (verts profonds, lueur #25D366 maitrisee), bouton #25D366, or MEG #E9D86A / #FFF3AE / #B9AA02 pour la marque,
  creme #FFFCD6 pour le texte ; police Cabinet Grotesk ; 0 emoji sauf le sourire de la reponse (v4) ; aucun son, jamais de musique.
  ZONE SURE : logo, textes, conversation, bouton et point de toucher dans #owa-zone (translate 91,8 px, 137,1 px, scale 0,83, comme DSS)
  = x 142-938, y 240-1493 ; fond, ambiance, vignette et grain restent plein cadre. Ne jamais sortir un element de #owa-zone ni changer son transform.
-->

          <svg data-hf-id="hf-owa-wa-logo" viewBox="0 0 256 256"><path data-hf-id="hf-owa-wa-logo-p" d="M152.58,145.23l23,11.48A24,24,0,0,1,152,176a72.08,72.08,0,0,1-72-72A24,24,0,0,1,99.29,80.46l11.48,23L101,118a8,8,0,0,0-.73,7.51,56.47,56.47,0,0,0,30.15,30.15A8,8,0,0,0,138,155ZM232,128A104,104,0,0,1,79.12,219.82L45.07,231.17a16,16,0,0,1-20.24-20.24l11.35-34.05A104,104,0,1,1,232,128Zm-40,24a8,8,0,0,0-4.42-7.16l-32-16a8,8,0,0,0-8,.5l-14.69,9.8a40.55,40.55,0,0,1-16-16l9.8-14.69a8,8,0,0,0,.5-8l-16-32A8,8,0,0,0,104,64a40,40,0,0,0-40,40,88.1,88.1,0,0,0,88,88A40,40,0,0,0,192,152Z"/></svg>

    <script>
      (() => {
        // ===== VARIABLES DU GABARIT outro-whatsapp-meg-v1 : textes par video (+ <img> de #owa-photos, url de #owa-ambiance, data-duration) =====
        const V = {
          appel1: "Vous aussi, votre NDA ?", appel2: "Écrivez-nous, on vous répond", motOr: "Écrivez-nous",
          sujet: "Déclaration active", sujetTag: "Réalisation",           // titre de la bulle photo (etiquette facultative : "")
          repere: "Suivie de juillet à novembre 2026",        // ligne repere sous le sujet ("" = masquee)
          message: "Je viens de voir votre réalisation, moi aussi je souhaite obtenir mon accès au portail EDOF.",   // ce que le visiteur enverrait
          reponse: "Top, je vous appelle dans quelques minutes 🤝",         // reponse de l'equipe (3,4 s)
          numero: "Envoyer un message",                           // v4 : libelle du bouton, aucun numero
          signe: "MEG Business 360",                              // fixe, exactement
          vTitre: "Demande EDOF acceptée", vSous: "du premier coup"  // vignette de la bulle ; l'illustration = contenu de #owa-illu
        };
        // ===== fin des variables =====
        try {
          const hv = window.__hyperframes && typeof window.__hyperframes.getVariables === "function" ? window.__hyperframes.getVariables() : null;
          if (hv) for (const k of ["appel1", "appel2", "motOr", "sujet", "sujetTag", "repere", "message", "reponse", "vTitre", "vSous"]) if (typeof hv[k] === "string") V[k] = hv[k];
        } catch (e) { /* valeurs du gabarit */ }

        const R = "owa-";
        const $ = id => document.getElementById(R + id);
        const D = Math.min(7, Math.max(6, Number($("racine").getAttribute("data-duration")) || 7));
        const fr = s => String(s).replace(/ ([!?:;])/g, " $1");   // espace fine insecable avant ! ? : ;

        // textes
        $("numero").textContent = V.numero;
        /* v4 : aucun lien de contact */
        const sp = V.signe.indexOf(" "), nom = $("nom"); nom.textContent = "";
        const nb = document.createElement("b"); nb.textContent = sp > 0 ? V.signe.slice(0, sp) : V.signe; nom.append(nb, sp > 0 ? V.signe.slice(sp) : "");
        const sj = $("sujet"); sj.textContent = V.sujet;
        if (V.sujetTag) { const e = document.createElement("em"); e.textContent = V.sujetTag; sj.append(e); }
        $("repere-t").textContent = V.repere; if (!V.repere) $("repere").style.display = "none";
        $("message").textContent = fr(V.message);
        $("vtitre").textContent = fr(V.vTitre); $("vsous").textContent = fr(V.vSous); if (!V.vSous) $("vsous").style.display = "none";
        $("reponse-t").textContent = fr(V.reponse);
        function ecrire(el, texte, mot) {
          el.textContent = ""; texte = fr(texte); const i = mot ? texte.indexOf(mot) : -1;
          if (i < 0) { el.textContent = texte; return; }
          const em = document.createElement("em"); em.textContent = mot;
          el.append(texte.slice(0, i), em, texte.slice(i + mot.length));
        }
        const s1 = document.querySelector("#" + R + "l1 span"), s2 = document.querySelector("#" + R + "l2 span");
        ecrire(s1, V.appel1, V.motOr); ecrire(s2, V.appel2, V.motOr);
        // 2 lignes a la meme taille, 960 px max ; message, reponse et sujet ajustes a leur bulle
        function ajuster() {
          for (const s of [s1, s2]) s.style.fontSize = "";
          const w = Math.max(s1.offsetWidth, s2.offsetWidth);
          if (w > 960) { const f = (76 * 960 / w).toFixed(1) + "px"; s1.style.fontSize = f; s2.style.fontSize = f; }
          /* v5 : message sur 2 lignes (max-width), sans reduction */
          const r = $("reponse-t"); r.style.fontSize = ""; if (r.offsetWidth > 760) r.style.fontSize = (33 * 760 / r.offsetWidth).toFixed(1) + "px";
          sj.style.fontSize = ""; if (sj.offsetWidth > 652) sj.style.fontSize = (48 * 652 / sj.offsetWidth).toFixed(1) + "px";
          const rp = $("repere"); rp.style.fontSize = ""; if (rp.scrollWidth > 652) rp.style.fontSize = (29 * 652 / rp.scrollWidth).toFixed(1) + "px";
        }
        ajuster(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajuster);

        // photos du sujet dans la bulle : les <img> statiques du HTML ; l'ambiance garde l'url de son <style>
        const photos = Array.from($("photos").querySelectorAll("." + R + "photo")).slice(0, 4);

        const tl = gsap.timeline({ paused: true });
        // REGLE 1re FRAME : aucun fromTo qui part d'une opacite 0 sur un element visible a 0 s ; tout est deja pose a t = 0.

        // photos : Ken Burns des 0 s, fondu enchaine de 0.5 s, partage egal de la duree
        const n = photos.length, seg = D / n;
        photos.forEach((el, i) => {
          const debut = i ? i * seg - 0.25 : 0, fin = i < n - 1 ? (i + 1) * seg + 0.25 : D;
          if (i) tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut", immediateRender: false }, debut);
          tl.fromTo(el, { scale: i % 2 ? 1.12 : 1.02 }, { scale: i % 2 ? 1.03 : 1.12, duration: fin - debut, ease: "sine.inOut", immediateRender: !i }, debut);
        });
        // vignette : leger zoom de l'illustration, le statut « accepte » bat 3 fois
        tl.fromTo("#" + R + "illu", { scale: 1 }, { scale: 1.05, duration: D, ease: "sine.inOut" }, 0);
        [0.5, 2.6, 4.7].forEach(t => {
          tl.to("#" + R + "ill-ok", { scale: 1.12, duration: 0.16, ease: "power2.out" }, t);
          tl.to("#" + R + "ill-ok", { scale: 1, duration: 0.3, ease: "back.out(2)" }, t + 0.16);
        });
        tl.fromTo("#" + R + "ill-coche", { strokeDashoffset: 0 }, { strokeDashoffset: 44, duration: 0.01, immediateRender: false }, 2.5);
        tl.to("#" + R + "ill-coche", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.6);
        tl.fromTo("#" + R + "ambiance", { scale: 1 }, { scale: 1.08, duration: D, ease: "sine.inOut" }, 0);

        // le point de toucher part de la photo du sujet et glisse vers le bouton (courbe : x et y avec 2 courbes differentes) — identique DSS
        const doigt = "#" + R + "doigt", wa = "#" + R + "wa";
        const DX0 = 905, DY0 = 1120, DX1 = 760, DY1 = 1564;
        tl.set(doigt, { x: DX0, y: DY0, scale: 0.6, opacity: 0 }, 0);   // le pointeur seul se pose (0,12 s), tout le contenu est deja la
        tl.to(doigt, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2)" }, 0.12);
        tl.to(doigt, { x: DX1, duration: 0.75, ease: "power1.inOut" }, 0.3);
        tl.to(doigt, { y: DY1, duration: 0.75, ease: "power2.in" }, 0.3);
        // appui sur le bouton
        tl.to(doigt, { scale: 0.78, duration: 0.1, ease: "power1.in" }, 1.05);
        tl.to(wa, { scale: 0.965, duration: 0.1, ease: "power1.in" }, 1.05);
        tl.to(wa, { scale: 1, duration: 0.18, ease: "power2.out" }, 1.15);
        tl.to(doigt, { scale: 1.25, opacity: 0, duration: 0.35, ease: "power1.out" }, 1.18);
        // message du prospect deja la (bulle entrante) : leger rebond a l'appui du bouton
        tl.fromTo("#" + R + "envoye", { scale: 1 }, { scale: 1.035, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.inOut", transformOrigin: "0% 50%" }, 1.2);
        // l'equipe ecrit… (statut + bulle « ••• »), puis repond a 3,4 s et repasse « en ligne »
        const TR = 3.4;
        tl.to("#" + R + "en-ligne", { opacity: 0, duration: 0.15 }, 2.15);
        tl.to("#" + R + "ecrit", { opacity: 1, duration: 0.15 }, 2.2);
        tl.fromTo("#" + R + "tape", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2)", immediateRender: false }, 2.22);
        for (let t = 2.3; t < TR - 0.2; t += 0.45) {
          [1, 2, 3].forEach(j => {
            tl.to("#" + R + "p" + j, { y: -8, duration: 0.15, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t + (j - 1) * 0.1);
            tl.to("#" + R + "b" + j, { y: -10, opacity: 0.55, duration: 0.15, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, t + (j - 1) * 0.1);
          });
        }
        tl.to("#" + R + "tape", { opacity: 0, scale: 0.85, duration: 0.12, ease: "power1.in" }, TR - 0.1);
        tl.fromTo("#" + R + "reponse", { opacity: 0, scale: 0.82, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "back.out(1.7)", immediateRender: false }, TR);
        tl.to("#" + R + "ecrit", { opacity: 0, duration: 0.15 }, TR);
        tl.to("#" + R + "en-ligne", { opacity: 1, duration: 0.15 }, TR + 0.05);
        // reponse MEG envoyee : ✓✓ puis lu (bleu)
        tl.set("#" + R + "coche1", { opacity: 0 }, 0);
        tl.set("#" + R + "coche2", { opacity: 1 }, TR);
        tl.set("#" + R + "coche2", { opacity: 0 }, TR + 0.6);
        tl.set("#" + R + "lu", { opacity: 1 }, TR + 0.6);
        // 2e appui : le point part de la reponse et retourne au bouton (sur le logo WhatsApp, le numero reste lisible)
        const T2 = D - 1.45, EX0 = 930, EY0 = 1380, EX1 = 300, EY1 = 1564;
        tl.set(doigt, { x: EX0, y: EY0, scale: 0.6, opacity: 0 }, T2 - 0.95);
        tl.to(doigt, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(2)" }, T2 - 0.93);
        tl.to(doigt, { x: EX1, duration: 0.75, ease: "power1.inOut" }, T2 - 0.75);
        tl.to(doigt, { y: EY1, duration: 0.75, ease: "power2.in" }, T2 - 0.75);
        tl.to(doigt, { scale: 0.78, duration: 0.1, ease: "power1.in" }, T2);
        tl.to(wa, { scale: 0.965, duration: 0.1, ease: "power1.in" }, T2);
        tl.to(wa, { scale: 1, duration: 0.18, ease: "power2.out" }, T2 + 0.1);
        tl.to(doigt, { scale: 1.25, opacity: 0, duration: 0.35, ease: "power1.out" }, T2 + 0.13);
        // halo du bouton qui respire, ondes qui partent du bouton, reflets
        tl.fromTo("#" + R + "halo", { opacity: 0.75 }, { opacity: 1, scale: 1.06, duration: 0.6, yoyo: true, repeat: Math.max(1, Math.floor(D / 0.6) - 1), ease: "sine.inOut" }, 0);
        [1.12, TR + 0.15, T2 + 0.07].forEach(t => tl.fromTo("#" + R + "onde", { opacity: 0.7, scaleX: 1, scaleY: 1 }, { opacity: 0, scaleX: 1.07, scaleY: 1.4, duration: 0.8, ease: "power2.out", immediateRender: false }, t));
        tl.fromTo("#" + R + "reflet", { x: -180 }, { x: 1080, duration: 0.95, ease: "power2.inOut", immediateRender: false }, 1.6);
        tl.fromTo("#" + R + "reflet", { x: -180 }, { x: 1080, duration: 0.95, ease: "power2.inOut", immediateRender: false }, D - 1.1);
        tl.to({}, { duration: 0 }, D);
        window.__timelines = window.__timelines || {};
        window.__timelines["outro-whatsapp-meg-v1"] = tl;
      })();
    </script>

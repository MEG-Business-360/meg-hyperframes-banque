<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080,height=1920">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}*{margin:0;padding:0;box-sizing:border-box}</style>
</head>
<body>
<!--
PASTILLE DATE DSS (valide JVT C01) — quand le locuteur cite une date ou un prix date.
  Pastille jaune #FFD400 posee au-dessus de la capsule de sous-titre (meme colonne, ecart 10 px),
  icone calendrier 30 px trait 2,4, texte 32 px encre #0A0E12. Elle vit le temps de la phrase.
-->
<div id="pastille-date-dss" data-composition-id="pastille-date-dss" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <style>
    @font-face { font-family: "TikTok Sans"; src: url("assets/TikTokSans-Bold750.ttf") format("truetype"); font-weight: 750; }
    #pastille-date-dss { position: absolute; inset: 0; z-index: 2; overflow: hidden; }
    .dss-capc { position: absolute; left: 0; right: 0; bottom: 424px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .dss-capc.dss-capc--raccord { bottom: 908px; }
    .dss-cap { max-width: 840px; padding: 16px 30px; border-radius: 22px; background: rgba(10,14,18,0.86); color: #FFFFFF; font-family: "TikTok Sans", sans-serif; font-weight: 750; font-size: 60px; line-height: 1.15; text-align: center; white-space: normal; text-wrap: balance; }
    .dss-cap b { color: #FFD400; font-weight: 750; }
    .dss-nom { white-space: nowrap; }
    .dss-date { display: flex; align-items: center; gap: 10px; padding: 8px 22px 8px 18px; border-radius: 999px; background: #FFD400; color: #0A0E12; font-family: "TikTok Sans", sans-serif; font-weight: 750; font-size: 32px; line-height: 1; white-space: nowrap; }
  </style>
  <div class="dss-capc" id="pastille-date-dss-cap"><div class="dss-date"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#0A0E12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" /><path d="M3 10h18M8 3v4M16 3v4" /></svg> Octobre 2025</div><div class="dss-cap">à moins<br>de <b>700&#160;000</b> dirhams.</div></div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.set("#pastille-date-dss-cap", { autoAlpha: 1 }, 0);
    window.__timelines["pastille-date-dss"] = tl;
  </script>
</div>
</body>
</html>

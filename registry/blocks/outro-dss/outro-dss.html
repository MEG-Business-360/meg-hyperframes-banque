      <script>
(() => {
    // Variables : valeurs par defaut declarees sur <html>, remplacees par variables.json au rendu
    const V = {"titre1": "Vlog JVT : parcs, écoles…", "titre2": "et cash-flow Airbnb", "motOr": "JVT", "episode": "Vlog JVT - Parcs, écoles… et cash-flow AirBnb", "duree": "24:57", "chapitres": "0,428,615,842,1260,1497", "depart": 37.15, "arrivee": 17.8, "chapitreAvant": "JVT reste sous-coté", "chapitreApres": "JVT reste sous-coté", "cc1": "Bienvenue à Jumeirah Village Triangle,", "cc1Debut": 18.05, "cc1Fin": 21.65, "cc2": "plus connu sous le nom de JVT", "cc2Debut": 22.25, "cc2Fin": 24.25};

    const EXTRAIT = 7.2, T0 = 0.8, FIN = 8;
    const CHAP = String(V.chapitres).split(/[ ,;]+/).filter(Boolean).map(Number);
    const TOTAL = CHAP[CHAP.length - 1];
    const DEPART = Number(V.depart), ARRIVEE = Number(V.arrivee);
    const LARG = 904, ECART = 4;

    // titre : 1 ou 2 lignes, mot en or, taille ajustee a 960 px max
    function ecrire(el, texte, mot) {
      el.textContent = "";
      const i = mot ? texte.indexOf(mot) : -1;
      if (i < 0) { el.textContent = texte; return; }
      const em = document.createElement("em"); em.textContent = mot;
      el.append(texte.slice(0, i), em, texte.slice(i + mot.length));
    }
    const s1 = document.querySelector("#o-l1 span"), s2 = document.querySelector("#o-l2 span");
    ecrire(s1, String(V.titre1), String(V.motOr || ""));
    if (String(V.titre2 || "").trim()) ecrire(s2, String(V.titre2), String(V.motOr || ""));
    else { document.getElementById("o-l2").style.display = "none"; document.getElementById("o-l1").style.top = "454px"; }
    function ajuster() { for (const s of [s1, s2]) { s.style.fontSize = ""; const w = s.offsetWidth; if (w > 960) s.style.fontSize = (80 * 960 / w).toFixed(1) + "px"; } }
    ajuster();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajuster);

    document.getElementById("o-episode").textContent = V.episode;
    document.getElementById("o-mini-duree").textContent = V.duree;
    document.querySelector("#o-mini-vu i").style.width = (DEPART / TOTAL * 100).toFixed(2) + "%";
    document.getElementById("o-chap-a").textContent = "• " + V.chapitreAvant + " ›";
    document.getElementById("o-chap-b").textContent = "• " + V.chapitreApres + " ›";
    document.getElementById("o-cc1").textContent = V.cc1;
    document.getElementById("o-cc2").textContent = V.cc2 || "";

    // barre de progression decoupee en chapitres
    const base = document.getElementById("o-base"), lu = document.getElementById("o-lu");
    lu.style.width = LARG + "px";
    for (let i = 0; i < CHAP.length - 1; i++) {
      const x = CHAP[i] / TOTAL * LARG, w = (CHAP[i + 1] - CHAP[i]) / TOTAL * LARG - (i < CHAP.length - 2 ? ECART : 0);
      for (const p of [base, lu]) { const s = document.createElement("div"); s.className = "seg"; s.style.left = x + "px"; s.style.width = Math.max(w, 2) + "px"; p.appendChild(s); }
    }
    const fmt = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = String(s % 60).padStart(2, "0"); return h ? h + ":" + String(m).padStart(2, "0") + ":" + r : m + ":" + r; };
    const temps = document.getElementById("o-temps");
    const secondes = [Math.floor(DEPART)];
    for (let s = Math.floor(ARRIVEE); s <= Math.floor(ARRIVEE + EXTRAIT); s++) secondes.push(s);
    secondes.forEach((s, i) => { const e = document.createElement("span"); e.id = "o-t" + i; e.textContent = fmt(s) + " / " + V.duree; temps.appendChild(e); });

    const tl = gsap.timeline({ paused: true });
    const px = s => s / TOTAL * LARG;
    const clip = s => "inset(0px " + (LARG - px(s)).toFixed(2) + "px 0px 0px)";

    // entree : fond, lecteur qui se pose, marque, titre
    tl.fromTo("#o-fond", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
    tl.fromTo("#o-lecteur", { y: 90, scale: 0.94, rotationX: 12, opacity: 0, transformPerspective: 1800 }, { y: 0, scale: 1, rotationX: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 0.04);
    tl.fromTo("#o-ambiance", { opacity: 0 }, { opacity: 0.18, duration: 0.5, ease: "power1.out" }, 0.1);
    tl.fromTo("#o-logo", { y: -16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.1);
    tl.fromTo("#o-kicker", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.2);
    tl.fromTo("#o-l1 span", { yPercent: 105 }, { yPercent: 0, duration: 0.65, ease: "power4.out" }, 0.26);
    tl.fromTo("#o-l2 span", { yPercent: 105 }, { yPercent: 0, duration: 0.65, ease: "power4.out" }, 0.36);

    // clic sur lecture
    tl.to("#o-bouton-play", { scale: 0.86, duration: 0.1, ease: "power1.in" }, 0.55);
    tl.fromTo("#o-onde", { scale: 0.2, opacity: 0 }, { scale: 1.6, opacity: 0.55, duration: 0.12, ease: "power1.out" }, 0.58);
    tl.to("#o-onde", { scale: 2.6, opacity: 0, duration: 0.25, ease: "power1.out" }, 0.7);
    tl.to("#o-bouton-play", { scale: 1, duration: 0.1 }, 0.66);
    tl.to("#o-mini", { opacity: 0, duration: 0.18, ease: "power1.out" }, T0 - 0.04);
    tl.fromTo(["#o-bas", "#o-haut"], { opacity: 0 }, { opacity: 1, duration: 0.15 }, T0);
    tl.to("#o-ambiance", { opacity: 0.6, duration: 1.2, ease: "sine.out" }, T0);

    // saut de la tete de lecture de la fin du clip vers l'extrait
    tl.set("#o-lu", { clipPath: clip(DEPART) }, 0);
    tl.set("#o-tete", { x: px(DEPART) }, 0);
    tl.set("#o-t0", { opacity: 1 }, 0);
    tl.set("#o-chap-a", { opacity: 1 }, 0);
    tl.to("#o-lu", { clipPath: clip(ARRIVEE), duration: 0.45, ease: "power3.inOut" }, T0 + 0.05);
    tl.to("#o-tete", { x: px(ARRIVEE), duration: 0.45, ease: "power3.inOut" }, T0 + 0.05);
    tl.fromTo("#o-tete", { scale: 1 }, { scale: 1.35, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, T0 + 0.05);
    tl.to("#o-lu", { clipPath: clip(ARRIVEE + EXTRAIT), duration: EXTRAIT - 0.5, ease: "none" }, T0 + 0.5);
    tl.to("#o-tete", { x: px(ARRIVEE + EXTRAIT), duration: EXTRAIT - 0.5, ease: "none" }, T0 + 0.5);
    tl.set("#o-chap-a", { opacity: 0 }, T0 + 0.45);
    tl.set("#o-chap-b", { opacity: 1 }, T0 + 0.45);
    tl.set("#o-t0", { opacity: 0 }, T0 + 0.45);
    tl.set("#o-t1", { opacity: 1 }, T0 + 0.45);
    for (let i = 2; i < secondes.length; i++) {
      const t = T0 + (secondes[i] - ARRIVEE);
      if (t < FIN) { tl.set("#o-t" + (i - 1), { opacity: 0 }, t); tl.set("#o-t" + i, { opacity: 1 }, t); }
    }
    // comme sur YouTube : les commandes se masquent, seule la barre rouge reste
    tl.to(["#o-degrade", "#o-ligne", "#o-haut"], { opacity: 0, duration: 0.4, ease: "power1.out" }, 3.7);
    tl.to("#o-piste", { y: 70, scaleY: 0.6, duration: 0.4, ease: "power2.inOut" }, 3.7);
    tl.to("#o-tete", { scale: 0, duration: 0.25, ease: "power1.in" }, 3.7);
    tl.to("#o-cc", { y: 60, duration: 0.4, ease: "power2.inOut" }, 3.7);
    // video : lente poussee
    tl.fromTo("#o-cadre-video", { scale: 1.0 }, { scale: 1.08, duration: EXTRAIT, ease: "sine.inOut" }, T0);
    // sous-titres facon YouTube CC (temps de l'episode)
    const cc = (id, debut, fin) => { const a = T0 + (Number(debut) - ARRIVEE), b = T0 + (Number(fin) - ARRIVEE); if (a >= T0 && a < FIN) { tl.set(id, { opacity: 1 }, a); tl.set(id, { opacity: 0 }, Math.min(b, FIN - 0.01)); } };
    cc("#o-cc1", V.cc1Debut, V.cc1Fin);
    if (V.cc2) cc("#o-cc2", V.cc2Debut, V.cc2Fin);

    // chaine + abonnement
    tl.fromTo("#o-chaine", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.25);
    tl.to("#o-abo", { scale: 0.93, duration: 0.1, ease: "power1.in" }, 2.3);
    tl.fromTo("#o-tap", { scale: 0.3, opacity: 0 }, { scale: 1.4, opacity: 0.5, duration: 0.12 }, 2.33);
    tl.to("#o-tap", { scale: 2.4, opacity: 0, duration: 0.3 }, 2.45);
    tl.to("#o-abo", { scale: 1, duration: 0.14, ease: "power2.out" }, 2.4);
    tl.to("#o-abo-off", { opacity: 0, duration: 0.12 }, 2.4);
    tl.to("#o-abo-on", { opacity: 1, duration: 0.12 }, 2.4);
    tl.fromTo("#o-cloche", { rotation: 0 }, { rotation: 16, duration: 0.08, yoyo: true, repeat: 5, ease: "sine.inOut" }, 2.5);

    // appel a l'action + reflet
    tl.fromTo("#o-cta", { opacity: 0, y: 22, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 2.95);
    tl.fromTo("#o-reflet", { x: -160 }, { x: 840, duration: 0.9, ease: "power2.inOut" }, 4.3);
    tl.fromTo("#o-reflet", { x: -160 }, { x: 840, duration: 0.9, ease: "power2.inOut", immediateRender: false }, 6.2);
    window.__timelines = window.__timelines || {};
    window.__timelines["outro"] = tl;
  })();
      </script>
  </body>
</html>
